name: DogVacay
description: 'DogVacay was a consumer marketplace for dog boarding, pet sitting, dog
  walking, and doggy daycare that connected pet owners with a network of vetted, background-checked
  pet sitters and hosts across the United States and Canada. Founded in 2012 and backed
  by Andreessen Horowitz (a16z), the company was acquired by and merged into Rover
  in 2017; the DogVacay brand has since been retired and dogvacay.com now redirects
  to Rover. No public developer API, developer portal, or API documentation was ever
  published, so this profile carries company identity only and no API artifacts.'
